# Runs the self test on every machine type GitHub offers standard runners for.
#
# Cost: this repository is public, and every runner named here is a standard
# GitHub-hosted runner, which GitHub does not charge for on a public repository.
# No larger runners, no self-hosted runners, and no schedule: it runs on a push,
# a pull request, or when someone presses the button.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: Self test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-14, macos-15, windows-2022, windows-2025]
    # Windows has no bash of its own. Git for Windows ships one, and it is already
    # on every runner because git is, so the scripts run there unchanged.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Versions
        run: |
          uname -a
          bash --version | head -1
          git --version
          python3 --version || python --version
      - name: Self test
        run: bash tests/selftest.sh

  scheduler:
    name: Scheduler files on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Shell and python parse
        run: |
          for f in bin/*.sh install.sh demo/make-demo.sh tests/selftest.sh; do bash -n "$f"; echo "parsed $f"; done
          (python3 -m py_compile bin/dashboard.py demo/make-demo.py) || python -m py_compile bin/dashboard.py demo/make-demo.py
      - name: The installer preflight runs and refuses cleanly
        run: |
          out=$(bash install.sh --check 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "Checking this machine" || { echo "preflight did not run"; exit 1; }
      - name: launchd plists are valid
        if: runner.os == 'macOS'
        run: |
          for p in launchd/*.tmpl; do
            sed -e 's|@@LABEL@@|com.test|g' -e 's|@@ROOT@@|/tmp/r|g' -e 's|@@LOGDIR@@|/tmp/l|g' "$p" > /tmp/u.plist
            plutil -lint /tmp/u.plist
          done
      - name: systemd units are valid
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/u
          for f in systemd/*.tmpl; do
            b=$(basename "$f" .tmpl)
            sed -e 's|@@ROOT@@|/tmp/r|g' -e 's|@@LOGDIR@@|/tmp/l|g' -e 's|@@PYTHON@@|/usr/bin/python3|g' "$f" > "/tmp/u/com.test.$b"
          done
          ls -1 /tmp/u
          systemd-analyze verify /tmp/u/com.test.*.service /tmp/u/com.test.*.timer
      - name: Task Scheduler accepts the four tasks, then they are removed
        if: runner.os == 'Windows'
        run: |
          B=$(cygpath -w "$(command -v bash)")
          set -e
          schtasks //create //f //tn "com.test.daily"  //sc daily  //st 02:30 //tr "\"$B\" -lc \"true\""
          schtasks //create //f //tn "com.test.weekly" //sc weekly //d SUN //st 03:30 //tr "\"$B\" -lc \"true\""
          schtasks //query  //tn "com.test.daily" //fo list //v | head -20
          schtasks //delete //f //tn "com.test.daily"
          schtasks //delete //f //tn "com.test.weekly"
          echo "Task Scheduler round trip OK"
